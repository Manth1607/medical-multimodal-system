<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Multimodal Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {font-family: 'Inter', sans-serif; background:#0f0f0f; color:#e0e0e0; margin:0; display:flex; justify-content:center; align-items:flex-start; padding-top: 50px; min-height:100vh; box-sizing: border-box;}
    .container {width:100%; max-width:800px; padding: 0 20px;}
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius:12px; 
      padding:1.5rem 2rem; 
      width:100%; 
      backdrop-filter:blur(20px); 
      box-shadow:0 10px 40px rgba(0,0,0,0.6); 
      margin-bottom: 1rem; 
      box-sizing: border-box;
    }
    h1 {font-weight:600; font-size: 28px; margin-bottom:1.5rem; color: #ffffff;}
    h2 {margin-top: 0; color: #ffffff; font-size: 22px; font-weight: 600;}
    input,textarea,button {width:100%; padding:0.8rem 1rem; margin-top:0.5rem; border:none; border-radius:6px; font-size: 1rem; font-family: 'Inter', sans-serif; box-sizing: border-box; outline: none;}
    input {background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2);}
    button {background:#4a90e2; color:#fff; cursor:pointer; transition:background .2s; font-weight: 600;}
    button:hover {background:#357ab8;}
    ul {margin: 0.5rem 0 0 0; padding-left: 1.5rem; line-height: 1.6;}
    li {margin-bottom: 0.3rem; color: #d1d5db;}
    strong {color: #ffffff; font-weight: 600; font-size: 15px;}
    .content-text {color: #d1d5db; font-size: 15px;}
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
